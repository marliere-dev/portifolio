server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /srv/portfolio/current;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
