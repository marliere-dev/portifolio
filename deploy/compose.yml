services:
  portfolio:
    image: nginx:1.27-alpine
    container_name: marliere-portfolio
    restart: unless-stopped
    volumes:
      - /home/ubuntu/marliere-portfolio:/srv/portfolio:ro
      - ./nginx/portfolio.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - npm

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
