name: Deploy portfolio to Oracle

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -s index.html
          test -s CNAME
          ! rg -n "<(script|iframe)[^>]+src=['\"]http:" index.html

  deploy:
    needs: verify
    runs-on:
      group: oracle-production
      labels: [self-hosted, linux, arm64, oracle-production]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Upload and activate release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          remote_root=/home/ubuntu/marliere-portfolio
          remote_release="$remote_root/releases/$RELEASE_ID"

          install -d -m 2775 "$remote_release"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/' \
            --exclude 'hackerfriend-v3/' \
            ./ "$remote_release/"

          test -s "$remote_release/index.html"
          ln -sfn "releases/$RELEASE_ID" "$remote_root/current"
          find "$remote_root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
